<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="120" height="120" rx="28" fill="#09090B"/>
  
  <!-- Ambient Soft Radial Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#glow)"/>
  
  <!-- Brand Habit Progress Arc -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round"
    stroke-dasharray="210 264" transform="rotate(-90 60 60)"/>
  
  <!-- Crisp Center Plus (+) Symbol -->
  <rect x="54" y="38" width="12" height="44" rx="6" fill="#F4F4F5"/>
  <rect x="38" y="54" width="44" height="12" rx="6" fill="#F4F4F5"/>
  
  <!-- Sky Blue Dynamic Indicator Dot -->
  <circle cx="21" cy="46" r="4.5" fill="#38BDF8"/>
</svg>